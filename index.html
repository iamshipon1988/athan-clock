<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nimazi - Prayer Companion</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="styles.css" rel="stylesheet">

<link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
<link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Nimazi" />
<link rel="manifest" href="/assets/favicon/site.webmanifest" />
</head>

<body>
<div class="pattern-overlay"></div>
<div class="geometric-pattern"></div>

<div class="container">

    <div class="header">
        <div class="header-left">
            <div class="bismillah">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
            <div class="current-time" id="clock">--:--</div>
            <button class="settings-button" onclick="openSettings()">
                <span class="material-icons">settings</span>
            </button>
        </div>
        <div class="date-info">
            <button class="date-nav-button date-nav-prev" id="dateNavPrev" onclick="navigateDateDebounced(-1)" aria-label="Previous day">
                <span class="material-icons">chevron_left</span>
            </button>
            <div class="date-container">
                <div class="gregorian-date" id="gregorianDate">Loading...</div>
                <div class="hijri-date" id="hijriDate">Loading...</div>
            </div>
            <button class="date-nav-button date-nav-next" id="dateNavNext" onclick="navigateDateDebounced(1)" aria-label="Next day">
                <span class="material-icons">chevron_right</span>
            </button>
        </div>
    </div>

    <div class="next-prayer-section">

        <div class="next-prayer-info">
            <div class="next-prayer-info-label">Next Prayer</div>
            <div class="next-prayer-name" id="nextPrayerName">Loading...</div>
        </div>
        <div class="next-prayer-time-info">
            <div class="next-prayer-time-label">Prayer Time</div>
            <div class="next-prayer-time" id="nextPrayerTime">--:--</div>
        </div>
        <div class="countdown-info">
            <div class="countdown-label">Time Remaining</div>
            <div class="countdown" id="countdown">Calculating...</div>
        </div>
        <div class="date-navigation-badge" id="dateNavigationBadge" style="display:none;">
            <div class="date-badge-date" id="viewedDateLabel">Today</div>
            <button class="back-to-today-button" id="backToTodayButton" onclick="navigateToToday()">Back to Today</button>
        </div>
    </div>

    <div class="prayer-grid" id="prayerGrid">
        <div class="loading">Loading prayer times</div>
    </div>

</div>

<!-- Prayer Time Modal -->
<div class="prayer-modal" id="prayerModal">
    <div class="prayer-modal-content">
        <div class="prayer-modal-icon">🕌</div>
        <h2 id="modalPrayerName">Prayer Time</h2>
        <div class="prayer-modal-time" id="modalPrayerTime">--:--</div>
        <div class="prayer-modal-info" id="modalPrayerInfo"></div>
        <button class="prayer-modal-button" onclick="stopAthan()">Stop Athan</button>
    </div>
</div>

<!-- Prayer Details Modal -->
<div class="prayer-details-modal" id="prayerDetailsModal">
    <div class="prayer-details-content">
        <button class="modal-close" onclick="closePrayerDetails()">✕</button>
        <div class="prayer-details-icon">🕌</div>
        <h2 id="detailsPrayerName">Prayer Details</h2>
        <div class="prayer-details-time" id="detailsPrayerTime">--:--</div>
        <div class="rakats-info" id="rakatsInfo"></div>
        <div class="prayer-description" id="prayerDescription"></div>
    </div>
</div>

<!-- Settings Modal -->
<div class="settings-modal" id="settingsModal">
    <div class="settings-modal-content">
        <h2>⚙️ Settings</h2>
        <div class="settings-form">
            <div class="form-group">
                <label for="zipCodeInput">ZIP Code</label>
                <div class="zip-input-group">
                    <input type="text" id="zipCodeInput" placeholder="Enter ZIP code" maxlength="5">
                    <button type="button" class="detect-location-button" id="detectLocationButton" onclick="detectLocation()" title="Detect my location">
                        <span class="material-icons">my_location</span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="themeSelect">Theme Preference</label>
                <select id="themeSelect">
                    <option value="auto">Auto (Ramadan theme during Ramadan)</option>
                    <option value="default">Default (Green)</option>
                    <option value="ramadan">Ramadan (Golden)</option>
                    <option value="kids">Kids (Colorful & Fun)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="athanSelect">Athan Voice</label>
                <select id="athanSelect">
                    <option value="default">Default</option>
                    <option value="Makkah">Makkah</option>
                    <option value="Madinah">Madinah</option>
                    <option value="Alaqsa">Al-Aqsa</option>
                    <option value="Al-Hussaini">Al-Hussaini</option>
                    <option value="Hafez">Hafez</option>
                    <option value="Minshawi">Minshawi</option>
                    <option value="Naghshbandi">Naghshbandi</option>
                    <option value="Saber">Saber</option>
                    <option value="Sharif">Sharif</option>
                </select>
                <button type="button" class="preview-athan-button" id="previewAthanButton" onclick="previewAthan()">🔊 Play</button>
            </div>
            <div class="settings-buttons">
                <button class="settings-cancel-button" onclick="closeSettings()">Cancel</button>
                <button class="settings-save-button" onclick="saveSettings()">Save</button>
            </div>
        </div>
        <div class="settings-copyright">
            <a href="https://nimazi.com" target="_blank" rel="noopener noreferrer">Nimazi</a> by <a href="https://sazzad.me" target="_blank" rel="noopener noreferrer">Sazzad Hossain</a>
        </div>
    </div>
</div>

<!-- Athan Audio -->
<audio id="athanAudio" preload="auto">
    <source src="athan/default.mp3" type="audio/mpeg">
</audio>

<script src="app.js"></script>

</body>
</html>
